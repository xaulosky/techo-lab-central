<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspección 3D | Techo Laboratorio Central Los Ángeles</title>
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js",
  "three/addons/": "./lib/addons/",
  "three-mesh-bvh": "./lib/three-mesh-bvh.js"
} }
</script>
<style>
:root{--bg:#14181c;--panel:#1c2228;--panel2:#242c34;--line:#303a44;--txt:#e6ebef;--mut:#8fa0ad;--acc:#3fb6d8;--danger:#ef5350}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:13px/1.4 system-ui,"Segoe UI",sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button:hover{background:#2e3842}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:var(--acc);border-color:var(--acc);color:#04202a;font-weight:700}
#app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:64px 1fr 300px;height:100%}
#top{grid-column:1/4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#top h1{font-size:14px;margin:0 8px 0 0;font-weight:700;white-space:nowrap}
#top .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#top label{color:var(--mut);display:flex;align-items:center;gap:6px}
#top input[type=range]{width:90px}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:8px 6px;overflow:auto;align-items:stretch}
#tools button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11px}
#tools button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tools hr{border:0;border-top:1px solid var(--line);width:100%;margin:2px 0}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.sw{height:22px;border-radius:5px;border:2px solid transparent;padding:0}
.sw.on{border-color:#fff}
#width{width:100%}
#stage{position:relative;overflow:hidden;min-width:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.badge{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px #000a;user-select:none}
.badge.sel{outline:3px solid #fff;z-index:5}
.badge.lbl{background:#000c!important;border-radius:5px}
#hint{position:absolute;left:12px;bottom:12px;background:#000b;padding:6px 10px;border-radius:7px;max-width:70%;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:#14181cee;z-index:20;text-align:center;padding:20px}
#loading progress{width:300px;accent-color:var(--acc)}
#loading.err #lmsg{color:#ff8a80}
#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#panel h2{margin:0;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#list{overflow:auto;flex:1;padding:8px;display:flex;flex-direction:column;gap:6px}
#panelfoot{padding:8px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px}
.item.sel{border-color:var(--acc)}
.item .hd{display:flex;align-items:center;gap:6px}
.item .dot{width:12px;height:12px;border-radius:50%;flex:none}
.item .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.item .ic{padding:2px 6px;font-size:12px}
.item .dt{color:var(--mut);margin-top:2px}
.item textarea{width:100%;margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px;resize:vertical;min-height:34px}
.item select{margin-top:5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px}
.empty{color:var(--mut);padding:12px;text-align:center}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#000d;padding:7px 14px;border-radius:7px;display:none;z-index:30}
#ptoggle{display:none}
@media (max-width:900px){
 #app{grid-template-columns:58px 1fr}
 #panel{position:fixed;right:0;top:0;bottom:0;width:min(300px,86vw);z-index:40;display:none;box-shadow:-4px 0 14px #000a}
 #panel.open{display:flex}
 #ptoggle{display:inline-block}
}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <h1>Inspección 3D · Techo Lab. Central Los Ángeles</h1>
  <button data-view="home">Inicio</button>
  <button data-view="top">Planta</button>
  <button data-view="obl">Oblicua ⟳</button>
  <span class="sep"></span>
  <label>Brillo <input type="range" id="bright" min="0.5" max="2" step="0.05" value="1"></label>
  <label><input type="checkbox" id="showAnn" checked> Anotaciones</label>
  <label title="Esfera del centro de giro: arrástrala o haz doble clic en el modelo para moverla"><input type="checkbox" id="showPivot" checked> Centro de giro</label>
  <span class="sep"></span>
  <button id="openGlb" title="Abrir otro GLB">Abrir GLB…</button>
  <button id="saveJson" title="Guardar anotaciones (JSON)">Guardar</button>
  <button id="loadJson" title="Cargar anotaciones (JSON)">Cargar</button>
  <button id="shot" title="Captura PNG con anotaciones">Captura</button>
  <button id="fs">Pantalla completa</button>
  <button id="ptoggle">Lista</button>
  <input type="file" id="glbFile" accept=".glb" hidden>
  <input type="file" id="jsonFile" accept=".json" hidden>
 </header>
 <nav id="tools" aria-label="Herramientas"></nav>
 <main id="stage">
  <canvas id="gl" tabindex="0"></canvas>
  <div id="overlay"></div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="loading"><div id="lmsg">Cargando modelo…</div><progress id="lprog" max="1" value="0"></progress>
   <div style="color:var(--mut);max-width:420px">Si el modelo no aparece, abre la carpeta con <code>iniciar.bat</code> o arrastra aquí un archivo <b>.glb</b>.</div></div>
 </main>
 <aside id="panel">
  <h2><span>Anotaciones <span id="count" style="color:var(--mut)"></span></span><span id="scaleInfo" style="color:var(--mut);font-weight:400"></span></h2>
  <div id="list"></div>
  <div id="panelfoot">
   <button id="undo" title="Ctrl+Z">↶ Deshacer</button>
   <button id="redo" title="Ctrl+Y">↷ Rehacer</button>
   <button id="clearAll">Borrar todo</button>
  </div>
 </aside>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
